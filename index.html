 else if(tight){type='资金关怀';headline='优先资金安排，不推动投入';reason='近期资金需求优先。记录情况并转交人工服务，本轮不主动触达。';primary='transfer';priority=1;minutes=4;goal='核实服务需求，保护流动性';}
 else if(uncertain){type='待核实资料';headline='先核实资金与风险情况';reason='当前资料不足以支持继续投入判断。通过中性说明回应疑问，邀请用户自愿补充资料。';primary=channel==='App 消息'?'assess':'transfer';priority=2;minutes=5;goal='补齐信息，回应疑问';}
 else if(operational){type='操作协助';headline='提供扣款与银行卡操作说明';reason='中断与扣款操作有关，用户主动寻求帮助。说明操作方式，是否恢复由用户自行决定。';primary=channel==='App 消息'?'guide':'transfer';priority=2;minutes=3;goal='解决操作障碍';}
 else if(concern){type='投资陪伴';headline='回应波动担忧，提供中性知识';reason='风险与资金资料已补充，仍需尊重自主选择，不承诺回本或推动加仓。';primary=channel==='App 消息'?'educate':'transfer';priority=3;minutes=4;goal='说明风险，保持自主决策';}
 else{type='人工核实';headline='原因尚不明确，转交人工核实';reason='现有信息无法可靠归因。先核实具体问题和服务需求，不猜测用户意愿。';primary='transfer';priority=2;minutes=5;goal='确认中断原因与需求';}
 if(tight)add('G02','近期资金需求',gap>0?`预计支出约 ${money(u.expense)} 元，可用资金约 ${money(u.liquidity)} 元；已知口径缺口约 ${money(gap)} 元。`:u.message,'不以恢复定投为目标；缺口仅按已提供资金口径测算，不代表全部资产。');
 if(uncertain)add('G03','资金与适当性待核实',`${riskLabels[u.risk]}；${fundLabels[u.funds]}。`,'已有 R3 记录不代表当前适合继续投入；不能直接推荐恢复、加仓或换产品。');
 if(operational)add('S01','操作求助信号',`${u.message} ${u.situation} ${u.behavior}`,'结合主动求助与操作记录提供说明；页面浏览不代表购买意愿。');
 if(concern)add('S02','市场波动担忧',`${u.message} ${u.record} ${u.behavior}`,'定投不能消除风险；浏览赎回页面不等于已决定赎回。');
 if(!operational&&!concern&&!refused&&!tight)add('S00','需要人工补充信息',u.message||u.situation||'暂无具体需求信息。','规则未识别到明确原因，保留未知，交由人工进一步核实。');
 add('G04','渠道与授权',u.preference||'尚未确认触达授权。',channel==='App 消息'?'仅使用已允许的 App 渠道，不扩展到短信或电话。':'本轮不主动触达；转交人工也只是内部服务任务。');
 const actions=refused?['stop','record','defer']:channel==='不触达'?['transfer','record','defer']:[primary,'transfer','record','defer'];

}
const ACTIONS={guide:{name:'发送操作说明',button:'审核并发送说明',result:'已模拟发送说明'},assess:{name:'发送风险说明并邀请补充资料',button:'审核并发送说明',result:'已模拟发送说明'},educate:{name:'发送定投知识',button:'审核并发送知识',result:'已模拟发送知识'},stop:{name:'停止营销信息触达',button:'确认停止营销',result:'已模拟停止营销'},transfer:{name:'转交人工客服',button:'转交人工客服',result:'已模拟转交客服'},record:{name:'记录反馈并观察',button:'记录并观察',result:'已记录反馈'},defer:{name:'暂缓处理',button:'暂缓处理',result:'已暂缓'}};

function baseDraftFor(u,d){
 if(d.refused||d.tight||d.channel==='不触达')return '';
 const warning='基金净值随市场波动，不保证收益和本金安全。';
 if(d.primary==='guide')return `您好，关于您${u.amount!==null?'每月 '+money(u.amount)+' 元定投的':'提到的'}扣款问题，本产品支持修改扣款银行卡、扣款日期及定投金额。您可以查看 App 内定投计划的相关操作说明，核对银行卡及资金情况；如您自主决定恢复，可使用计划的恢复功能，具体入口以实际 App 为准。需要帮助时可联系人工客服。${warning}`;
 return `您好，理解您对定投的疑问。定投不能消除市场风险，${warning}您可以继续保持暂停，不必急于决定。若您愿意，可先梳理近期资金安排并确认当前风险承受能力，再联系人工客服了解相关知识。是否继续投入由您自主决定。`;
}
function baseValidate(u,action,text,note){
 const d=analyze(u),errors=[];
 if(!d.actions.includes(action))errors.push('当前动作不符合用户意愿与保护规则。');
 if(external(action)&&(d.channel!=='App 消息'||d.refused||d.tight))errors.push('当前用户不允许主动触达。');
 if(!external(action)&&text.trim())errors.push('内部动作不能携带对客文案。');
 if(external(action)&&!text.trim())errors.push('发送前请填写服务说明。');
 if(external(action)&&!text.includes('不保证收益和本金安全'))errors.push('请保留“不保证收益和本金安全”的风险提示。');
 const clean=text.replaceAll('不保证收益和本金安全','');
 if(/(保本|稳赚|保证.*收益|一定.*(涨|回本)|必.*回本|抄底|加仓|无风险|(建议|推荐|尽快|马上|赶紧).*(恢复|买入|购买|投资)|继续.*买入)/.test(clean))errors.push('文案含收益承诺或诱导投入表述，请修改。');
 if(['transfer','defer'].includes(action)&&!note.trim())errors.push(action==='defer'?'请填写暂缓原因。':'请填写转交说明。');
 return errors;
}

function v3Analyze(u){const d=baseAnalyze(u);if(u.marketingSuppressed&&!d.refused){d.channel='不触达';d.primary='transfer';d.reason='已有人工停止营销安排。维持不触达，仅转交内部客服核实后续服务需求。';}d.actions=d.refused||d.tight||d.channel==='不触达'?['stop','transfer','record','defer','hold']:['guide','assess','educate','invite','transfer','record','defer','hold','stop'];return d;}
function outbound(a){return ['guide','educate','product','invite','assess'].includes(a);}
function v3ActionDraft(u,d,a){if(d.refused||d.tight||d.channel==='不触达')return '';if(a==='invite')return '您好，如您愿意，可主动联系人工客服说明您的定投问题。您无需立即决定是否继续投入。基金净值随市场波动，不保证收益和本金安全。';return baseDraftFor(u,{...d,primary:a});}
function draftFor(u,d){return actionDraft(u,d,d.primary);}
function v3Validate(u,a,text,note){if(a==='invite')return baseValidate(u,'assess',text,note);return baseValidate(u,a,text,note);}

function v3DetailHTML(){let html=baseDetailHTML();const u=current(),d=analyze(u),f=latestFeedback(u);html=html.replace('分析结论','AI 分析结论');const start=html.indexOf('<div class="more-actions">'),end=html.indexOf('</div></section>',start);if(start>=0)html=html.slice(0,start)+`<div class="more-actions"><span>人工决策</span><button class="btn" data-action="plan" data-id="${esc(u.id)}">${icon('edit')}调整处理方案</button><button class="btn" data-action="feedback" data-id="${esc(u.id)}">${icon('check')}${f?'查看 / 更新评价':'评价 AI 建议'}</button></div>`+html.slice(end+6);html=html.replace(/<button class="btn ([^"]*)" data-action="review"([^>]*?)>.*?<\/button>/,`<button class="btn primary" data-action="plan" data-id="${esc(u.id)}">${icon('check')}${pending(u)?'采纳或调整方案':'安排后续动作'}</button>`);html=html.replace('<div class="work-column">',`<div class="work-column"><div class="report-entry"><div><strong>用户分析报告</strong><small>原因与诉求、风险信号、证据、待补充资料及人工判断</small></div><button class="btn small" data-action="analysis-report" data-id="${esc(u.id)}">查看详细报告 ${icon('arrow')}</button></div>`);if(f)html=html.replace('<div class="detail-grid">',`<div class="feedback-banner">人工评价：${esc(f.rating)} · ${esc(f.reason||'认可当前建议')} <span>已保存至当前资料版本</span></div><div class="detail-grid">`);return html;}

function openPlan(id,chosen){const u=state.users.find(x=>x.id===id);if(!u)return;const d=analyze(u);const previous=state.logs.find(l=>l.userId===id&&l.revision===u.revision);let a=chosen&&d.actions.includes(chosen)?chosen:previous&&d.actions.includes(previous.action)?previous.action:d.primary;const previousCount=state.logs.filter(l=>l.userId===id).length;showModal('调整处理方案',`<form id="plan-form"><div class="notice"><strong>AI 建议：${ACTIONS[d.primary].name}</strong><br>${esc(d.reason)}${d.refused?'<br>停止营销保护持续有效；即使改为内部转交或观察，也不能恢复营销触达。':''}</div><div class="form-grid"><div class="field"><label for="decision-mode">处理方式</label><select id="decision-mode"><option value="accept" ${a===d.primary?'selected':''}>采纳建议</option><option value="adjust" ${a!==d.primary?'selected':''}>调整处理方案</option><option value="reject">建议不适用，改为人工处理</option></select></div><div class="field"><label for="final-action">最终执行动作</label><select id="final-action">${CATALOG.map(([g,keys])=>`<optgroup label="${g}">${keys.map(k=>`<option value="${k}" ${k===a?'selected':''} ${d.actions.includes(k)?'':'disabled'}>${ACTIONS[k].name}${d.actions.includes(k)?'':'（受保护规则限制）'}</option>`).join('')}</optgroup>`).join('')}</select></div></div><div id="action-editor"></div><div class="field" style="margin-top:16px"><label for="decision-reason">判断理由 / 跟进要点</label><textarea id="decision-reason" rows="2" placeholder="调整或不采纳建议时必填；说明依据或需要客服核实的问题"></textarea></div><div class="field" style="margin-top:14px"><label for="followup">后续复核日期</label><input id="followup" type="date" min="${today()}" value="${u.followUp&&u.followUp>=today()?u.followUp:''}"><small>暂缓或记录观察时必填。到期后会在队列标记待复核；不自动向用户发送消息。</small></div><div id="review-error"></div><div class="modal-footer"><small class="muted" style="margin-right:auto">本次仅登记模拟结果，不触达真实用户。</small><button type="button" class="btn" data-action="close-modal">取消</button><button type="submit" class="btn primary">保存调整并执行</button></div></form>`,true);
 const select=document.getElementById('final-action'),mode=document.getElementById('decision-mode');
 const render=()=>{a=select.value;document.getElementById('action-editor').innerHTML=outbound(a)?`<div class="field" style="margin-top:16px"><label for="review-text">服务说明（${d.channel}，可修改）</label><textarea id="review-text" rows="5">${esc(actionDraft(u,d,a))}</textarea><small>最终内容仍需人工检查；不得承诺收益或诱导继续投入。</small></div>`:`<div class="internal-block" style="margin-top:16px">${ACTIONS[a].name} · 内部处理，不附带对客文案。${d.refused?'拒绝营销保护不会因更换动作而取消。':''}</div>`;};
 document.getElementById('decision-reason').placeholder='说明本次调整依据；已执行的历史动作不会被撤销';select.onchange=()=>{mode.value=select.value===d.primary?'accept':'adjust';render();};mode.onchange=()=>{if(mode.value==='accept')select.value=d.primary;if(mode.value==='reject')select.value='transfer';render();};render();
 document.getElementById('plan-form').onsubmit=e=>{e.preventDefault();const latest=state.users.find(x=>x.id===id);const error=document.getElementById('review-error');if(latest.revision!==u.revision||state.logs.filter(l=>l.userId===id).length!==previousCount){error.innerHTML='<div class="error">处理状态已变化，请重新打开审核。</div>';return;}const action=select.value,text=document.getElementById('review-text')?.value.trim()||'',note=document.getElementById('decision-reason').value.trim(),due=document.getElementById('followup').value,decision=mode.value;const problems=validate(latest,action,text,note);if((previousCount>0||decision!=='accept'||action!==d.primary)&&!note)problems.push('请填写调整或不采纳建议的理由。');if(['record','defer'].includes(action)&&!due)problems.push('请设置后续复核日期。');if(due&&due<today())problems.push('复核日期不能早于今天。');if(problems.length){error.innerHTML=`<div class="error" role="alert">${problems.map(x=>`<p>${esc(x)}</p>`).join('')}</div>`;return;}commitDecision(latest,{action,text,note,due,mode:decision,origin:'adjustment'});};}
function v6FeedbackModal(id){const u=state.users.find(x=>x.id===id),old=latestFeedback(u);showModal('评价 AI 建议',`<form id="feedback-form"><p>评价只用于保存纠正意见与统计，不会自动执行动作或改变用户资料。</p><div class="field"><label for="rating">建议评价</label><select id="rating">${['认可','需调整','不适用'].map(r=>`<option ${old?.rating===r?'selected':''}>${r}</option>`).join('')}</select></div><div class="field" style="margin-top:15px"><label for="feedback-reason">纠正理由 / 补充判断</label><textarea id="feedback-reason" rows="4">${esc(old?.reason||'')}</textarea></div><div id="feedback-error"></div><div class="modal-footer"><button class="btn" type="button" data-action="close-modal">取消</button><button class="btn primary" type="submit">保存评价</button></div></form>`);document.getElementById('feedback-form').onsubmit=e=>{e.preventDefault();const rating=document.getElementById('rating').value,reason=document.getElementById('feedback-reason').value.trim();if(rating!=='认可'&&!reason){document.getElementById('feedback-error').innerHTML='<div class="error" role="alert">请补充纠正理由。</div>';return;}state.feedback.unshift({id:uid(),userId:id,revision:u.revision,rating,reason,at:new Date().toISOString(),source:'独立评价',input:clone(u),suggestion:analyze(u)});persist();closeModal();shell();toast('评价已保存，已更新运营报表中的人工反馈统计。');};}
function today(){return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());}
function uncertainItems(u,d){const missing=[];if(capacityRank(u)===null)missing.push('当前 R 口径风险承受能力及评估时点');if(['unknown','unverified'].includes(u.funds))missing.push('近期资金安排');if(!productFor(u))missing.push('完整的关联基金资料');if(!['app','sms'].includes(u.channel))missing.push('主动触达授权');if(u.liquidity===null)missing.push('可随时使用的资金');if(u.expense===null)missing.push('近期大额支出');return missing;}

function v3AnalysisBody(u){const d=analyze(u),f=latestFeedback(u),missing=uncertainItems(u,d);return `<article class="analysis-report"><div class="report-title"><span>用户分析报告</span><h1>${esc(u.name)}${u.name!==u.id?' · '+esc(u.id):''}</h1><p>资料版本 ${u.revision+1} · ${formatTime(new Date().toISOString())}</p></div><section><h2>1. 结论与下一步</h2><div class="analysis-lead"><strong>${d.headline}</strong><p>${d.reason}</p></div><div class="report-facts"><div><span>用户分层</span><strong>${d.type}</strong></div><div><span>AI 建议动作</span><strong>${ACTIONS[d.primary].name}</strong></div><div><span>处理优先级</span><strong>P${d.priority} · 参考 ${d.minutes} 分钟</strong></div></div><p>处理目标：${d.goal}。恢复定投不是默认目标。</p></section><section><h2>2. 用户背景与中断经过</h2>${[['用户画像',u.profile],['投资目标',u.goal],['投资情况',u.investment],['定投记录',u.record],['中断情况',u.situation],['用户行为',u.behavior],['最近留言',u.message],['历史沟通',u.history]].map(([k,v])=>`<div class="report-line"><strong>${k}</strong><span>${esc(v||'未提供')}</span></div>`).join('')}</section><section><h2>3. 资金与风险判断</h2><p>${esc(u.finance||'资金背景未提供')}</p><div class="report-line"><strong>当前核实状态</strong><span>${riskLabels[u.risk]}；${fundLabels[u.funds]}</span></div><div class="report-line"><strong>资金缺口</strong><span>${d.gap===null?'信息不足，不计算缺口':`可用资金约 ${money(u.liquidity)} 元；预计支出约 ${money(u.expense)} 元；已知口径缺口约 ${money(d.gap)} 元。此结果不等同于全部资产缺口。`}</span></div><p>${u.risk==='R2'?'当前记录 R2 低于产品 R3，应交由人工核实适当性，不推荐继续投入。':d.tight?'近期支出优先于投资安排，不建议恢复或追加投入。':'已有投资经验和历史风险记录不代替当前适当性核实。'}基金净值随市场波动，不保证收益和本金安全。</p></section><section><h2>4. 证据与规则解释</h2>${d.evidence.map(e=>`<div class="report-evidence"><h3>${e.code} · ${e.title}</h3><blockquote>${esc(e.fact)}</blockquote><p>${e.why}</p></div>`).join('')}</section><section><h2>5. 信息缺口与复核重点</h2>${missing.length?`<ul>${missing.map(x=>`<li>${x}</li>`).join('')}</ul>`:'<p>核心结构化资料已补充，仍需人工核对其真实性与时效；不据此自动推荐买入。</p>'}<p>推荐复核：${d.refused?'落实免打扰标记，不通过触达重复询问是否愿意购买。':d.tight?'仅在用户主动求助或正式服务流程内核实资金需求，不推动投入。':'核对当前需求，必要时邀请用户自愿联系人工客服。'}</p></section><section><h2>6. 人工决策与反馈</h2><p>当前状态：${esc(u.processingState||u.status)}${u.followUp?'；复核日期：'+esc(u.followUp):''}。</p><p>最新评价：${f?esc(f.rating)+'；'+esc(f.reason||'认可当前建议'):'尚未评价'}</p>${state.logs.filter(l=>l.userId===u.id).slice(0,4).map(l=>`<p>${formatTime(l.at)} · ${ACTIONS[l.action]?.name} · ${esc(l.note||'无备注')}</p>`).join('')}<p class="report-disclosure">分析由本地规则与模板生成，所有执行记录为演示登记；不连接真实账户。人工反馈保留用于复盘，不会自动训练模型。</p></section></article>`;}

function openAdopt(id){v6OpenAdopt(id);const u=state.users.find(x=>x.id===id);if(!u||!document.getElementById('adopt-form'))return;const d=analyze(u);if(!['defer','record'].includes(d.primary))return;const revision=u.revision,count=state.logs.filter(l=>l.userId===id).length;document.getElementById('adopt-error').insertAdjacentHTML('beforebegin',`<div class="field"><label for="adopt-due">复核日期 *</label><input id="adopt-due" type="date" min="${today()}" required></div>`);document.getElementById('adopt-form').onsubmit=e=>{e.preventDefault();const latest=state.users.find(x=>x.id===id),due=document.getElementById('adopt-due').value;if(!latest||latest.revision!==revision||!pending(latest)||state.logs.filter(l=>l.userId===id).length!==count){document.getElementById('adopt-error').innerHTML='<div class="error">资料或状态已变化，请重新确认。</div>';return;}if(!due||due<today()){document.getElementById('adopt-error').innerHTML='<div class="error">请设置有效复核日期。</div>';return;}const errors=validate(latest,d.primary,'',d.reason);if(errors.length){document.getElementById('adopt-error').innerHTML=`<div class="error">${esc(errors.join('；'))}</div>`;return;}commitDecision(latest,{action:d.primary,note:d.reason,due,mode:'accept',origin:'adoption'});};}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action="rate"]');if(!b)return;const u=state.users.find(x=>x.id===b.dataset.id);if(!u)return;const rating=b.dataset.rating;if(rating==='认可')saveRating(u,rating);else feedbackModal(u.id,rating);});
// Business plans are driven by current facts and the selected action, never by user ID.
function businessPlan(raw,action){
 const s=inputSignals(raw),u=s.u,p=s.p;
 const fund=p?.name||'关联基金',warning=p?.warning||'基金净值随市场波动，不保证收益和本金安全。';
 const loss=typeof u.returns==='number'&&u.returns<0?`累计亏损约 ${Math.abs(u.returns)}%`:'近期净值波动';
 const amount=u.amount===null?'当前':`${money(u.amount)} 元的`;
 const canChangeCard=!!p?.modifiable.includes('扣款银行卡'),canResume=!!p?.states?.includes('恢复');
 const cardChange=/(换.*(工资卡|银行卡)|更换.*卡)/.test(u.message+'；'+u.situation);
 const cardFunding=/(忘记.*(放钱|转钱|存钱)|原.*卡.*(没钱|没放|放钱)|余额不足)/.test(u.message+'；'+u.situation);
 const cardIssue=/(工资卡|银行卡|扣款)/.test(u.message)&&s.operational;
 const summary={headline:ACTIONS[action]?.name||'核实需求',cause:'现有信息尚不足以完整归因。',reason:'请结合已知资料核对具体需求。',goal:'确认需求并选择适当服务',steps:[],followUp:'取得新事实后更新资料并重新分析。',draft:''};
 if(action==='stop'&&s.refused){
  const pressure=s.tight?`${u.expense!==null?'预计支出 '+money(u.expense)+' 元，':''}${u.liquidity!==null?'可随时使用资金 '+money(u.liquidity)+' 元；':''}${s.gap>0?'已知口径缺口约 '+money(s.gap)+' 元，不等于全部资产缺口。':'已出现近期资金压力。'}`:'';
  return {...summary,headline:s.tight?'近期资金需求优先，停止营销触达':'尊重拒绝意愿，停止营销触达',cause:`${s.tight?'近期资金支出需求与明确拒绝营销同时存在。':'用户明确拒绝营销。'}${pressure}`,reason:`${pressure}用户当前留言${REJECT.test(u.history)?'及历史客服沟通均':''}明确拒绝营销，${u.planStatus==='terminated'?'用户已终止定投，':''}不能以亏损或长期目标为由推动恢复。`,goal:'落实拒绝营销保护，保留必要的被动服务支持',steps:['登记停止营销，覆盖 App、短信及电话等营销渠道，不另发确认或客服邀请。','记录用户原话、近期资金安排及已有计划状态；不改动用户的终止或赎回决定。','仅在用户主动提出账户或赎回流程问题时提供必要服务；不将后续观察设为再次营销。'],followUp:'核对停止标记是否落实；不安排主动营销回访，不因新留言自动解除历史拒绝。'};
 }
 if(action==='guide'&&cardIssue&&!s.amountConflict&&!s.cycleConflict){
  const root=cardChange&&cardFunding?'更换工资卡后，原扣款卡未补足资金':cardChange?'工资卡变更后，扣款卡与入账卡可能不一致':'存在银行卡或扣款操作问题，具体失败原因仍需核对';
  const failures=u.failureCount?`连续 ${u.failureCount} 次扣款失败`:'发生扣款失败';
  const paused=u.planStatus==='autoPaused'?'，计划已自动暂停':'';
  const cardStep=canChangeCard?'可保留原扣款卡并在扣款前备足资金，或由用户将扣款银行卡修改为新的工资卡（可用银行卡以实际页面为准）。':'先核实该基金是否支持修改扣款银行卡，不直接承诺可以换卡。';
  const resumeStep=canResume?'核对扣款日期、可用余额和页面提示后，由用户自主使用恢复功能，并查看计划状态及下一次扣款信息。':'核实恢复权限和计划状态；不承诺该计划可直接恢复。';
  const boundary=p?`本基金${p.modifiable.length?'支持修改'+p.modifiable.join('、'):'修改权限待核实'}；最低 ${money(p.minAmount)} 元，支持${Object.values(p.cycles).join('、')}。`:'';
  return {...summary,headline:'先处理扣款银行卡，再自主恢复计划',cause:`${root}，${failures}${paused}。这是操作障碍，不据此推断用户资金紧张或放弃投资。`,reason:`${root}，${failures}${paused}。用户主动询问恢复方式；${boundary}因此通过已授权渠道说明银行卡与恢复步骤，不推销其他产品。`,goal:cardChange?'解决工资入账卡与扣款卡的衔接问题，帮助用户自主完成账户操作':'核实扣款障碍并提供支持范围内的操作说明',steps:[cardStep,resumeStep,'补足余额不代表暂停计划已自动恢复；若仍扣款失败，邀请用户主动联系客服核实原因，不承诺补扣。'],followUp:'核对用户是否仍有换卡或恢复困难；查看计划页面只作操作困难佐证，不当作恢复成功。',draft:`您好，${cardChange&&cardFunding?'您提到更换工资卡后，原扣款卡忘记放钱。':cardChange?'您提到工资卡变更后的扣款问题。':'您提到银行卡扣款问题，需先核对失败原因。'}${failures}${paused}，先处理扣款卡与资金的衔接即可核对后续操作：\n1. ${cardStep}\n2. ${resumeStep}\n3. 仅补足余额不代表计划已恢复。如换卡或恢复仍失败，可主动联系人工客服核实；是否补扣以实际规则为准。\n${fund}${amount}定投是否恢复由您自主决定，我们不会代您修改或恢复。${warning}`};
 }
 if(['invite','educate','assess'].includes(action)&&s.concern){
  const ratio=u.monthlySurplus>0&&u.amount!==null?`每月定投 ${money(u.amount)} 元，约占月结余 ${money(u.monthlySurplus)} 元的 ${Math.round(u.amount/u.monthlySurplus*100)}%`:'每月投入与结余的关系尚待核实';
  const cash=u.liquidity===null?'活期资金未提供':`活期资金约 ${money(u.liquidity)} 元`;
  const unresolved=s.fundsUnknown||!s.riskConfirmed;
  const goalNote=u.targetYears!==null?`${u.targetYears} 年及以上的目标`:'长期目标';
  const historicalRisk=/(一年前|记录)/.test(u.investment||'')?'历史风险记录不代替当前核实。':'风险等级初筛不代替完整适当性判断。';
  const context=`${loss}后主动暂停并担忧是否继续。${ratio}，${cash}；${unresolved?'近期用钱安排或当前风险承受能力尚未确认':'当前资金与承受能力资料已补充'}。`;
  const invitation='若您愿意，可主动联系人工客服，说明近期用钱时间与金额、应急资金安排，以及目前可接受的亏损程度，必要时更新风险测评后再评估。';
  return {...summary,headline:unresolved?'先回应亏损担忧，核实资金与承受能力':'回应波动担忧，说明定投风险',cause:`${loss}引起波动担忧，而非已确认的扣款故障。浏览赎回页面不等于已决定赎回。`,reason:`${context}${goalNote}不抵消短期用钱需求；${historicalRisk}先发中性风险说明与自愿服务邀请，不给出继续、赎回或追加结论。`,goal:'回应真实亏损感受，补齐资金与承受能力，再由用户自主决策',steps:[`先回应${loss}的担忧：定投分批投入不能消除市场风险，也不能保证回本。`,`核实近期用钱时间、金额和应急储备；${ratio}只是核实线索，不等于一定负担得起。`,'邀请用户自愿联系人工客服，核实当前可接受的亏损程度与风险测评；资料未核实前可保持暂停，不推荐恢复或追加。'],followUp:'仅根据用户自愿补充的资料重新评估；不把浏览收益或赎回页面视为交易指令。',draft:`您好，看到您提到最近下跌、担心是否继续；您这笔${fund}定投${loss}，理解您的担忧。${p?`本基金为${p.type}，基金风险等级 ${p.risk}。`:''}定投分批投入不能消除市场风险，也不能保证回本。\n您目前${ratio}，${cash}，还需要结合近期是否用钱、应急储备和现在能承受的亏损程度来判断；${goalNote}也不代表必须继续投入。\n${invitation}在信息核实前，您可以保持暂停，无需急于决定恢复、追加或赎回；我们不会替您操作。${warning}`};
 }
 if(action==='transfer'&&s.tight){return {...summary,headline:'先处理近期资金需求，转内部服务',cause:'近期资金安排存在压力。',reason:`近期资金需求优先于投入，${s.gap>0?'已知口径资金缺口约 '+money(s.gap)+' 元；':''}仅创建内部任务，不主动邀请继续投资。`,goal:'保护流动性并核实必要服务',steps:['记录当前资金需求及用户已有操作。','仅建立内部服务事项，不自动联系用户或劝投。','用户主动求助时提供所需账户服务，不替用户决定赎回。']};}
 return null;
}
function businessPlanHTML(u,d){const b=d.businessPlan;if(!b)return '';return `<section class="panel business-plan"><div class="panel-head"><h2>本次处理要点</h2><span class="pill gray">${esc(d.channel)}</span></div><div class="business-plan-body"><p><strong>中断原因：</strong>${esc(b.cause)}</p><ol>${b.steps.map(t=>`<li>${esc(t)}</li>`).join('')}</ol><p class="business-followup"><strong>后续核对：</strong>${esc(b.followUp)}</p></div></section>`;}

window.addEventListener('pageshow',e=>{if(e.persisted)location.reload();});
window.FundPilot={analyze,draftFor,validate,seeds:clone(SEEDS),extended:clone(EXTENDED),summaryData,structured,checksFor,extractSignals,product:clone(PRODUCT),products:()=>clone(state.products),evaluateActions};
shell();
